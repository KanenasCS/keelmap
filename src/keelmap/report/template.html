<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="referrer" content="no-referrer">
<title>KeelMap asset chart</title>
<style>
:root {
  color-scheme: light;
  --water: #d8e9ee;
  --grid: rgba(27, 52, 66, 0.07);
  --paper: #f6f7f2;
  --paper-edge: #d9ddd2;
  --ink: #1b2d38;
  --ink-soft: #566a74;
  --ink-faint: #8a9aa1;
  --magenta: #a61e78;
  --buff: #e3cf93;
  --buff-edge: #8a6f22;
  --sea-green: #2f7a5a;
  --sea-green-fill: #b9dcc8;
  --warn: #b55a00;
  --focus: #a61e78;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --water: #0f1d24;
    --grid: rgba(150, 190, 205, 0.06);
    --paper: #16252d;
    --paper-edge: #2a3d47;
    --ink: #d3e0e5;
    --ink-soft: #93abb4;
    --ink-faint: #637d87;
    --magenta: #e467bd;
    --buff: #6f5f2c;
    --buff-edge: #d8bd6a;
    --sea-green: #6cc79c;
    --sea-green-fill: #1f4a39;
    --warn: #f0a050;
    --focus: #e467bd;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --water: #0f1d24; --grid: rgba(150, 190, 205, 0.06); --paper: #16252d; --paper-edge: #2a3d47;
  --ink: #d3e0e5; --ink-soft: #93abb4; --ink-faint: #637d87; --magenta: #e467bd; --buff: #6f5f2c;
  --buff-edge: #d8bd6a; --sea-green: #6cc79c; --sea-green-fill: #1f4a39; --warn: #f0a050; --focus: #e467bd;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.5 var(--sans);
  font-variant-numeric: tabular-nums;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(0, 1fr) 400px; height: 100%; }

/* chart: the one bold element, drawn like chart paper with a graticule */
.chart {
  position: relative;
  background-color: var(--water);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  overflow: hidden;
  border-right: 1px solid var(--paper-edge);
}
#cy { position: absolute; inset: 0; }

.cartouche {
  position: absolute; top: 20px; left: 20px; z-index: 2;
  max-width: min(380px, calc(100% - 40px));
  background: var(--paper);
  border: 1px solid var(--ink);
  outline: 1px solid var(--ink); outline-offset: 3px;
  padding: 14px 18px 12px;
}
.cartouche h1 {
  font: 400 1.75rem/1.1 var(--serif);
  margin: 0 0 6px;
  letter-spacing: 0.01em;
}
.cartouche p { margin: 0; color: var(--ink-soft); font-size: 0.875rem; }
.cartouche .redaction { margin-top: 8px; font-size: 0.8125rem; color: var(--ink); }
.cartouche .redaction.unredacted { color: var(--magenta); font-weight: 600; }

.controls { position: absolute; top: 20px; right: 20px; z-index: 2; display: flex; gap: 8px; }
.controls input {
  width: 200px; padding: 7px 10px; background: var(--paper); border: 1px solid var(--paper-edge); border-radius: 3px;
}
.controls button, .panel button.link {
  padding: 7px 12px; background: var(--paper); border: 1px solid var(--paper-edge); border-radius: 3px; cursor: pointer;
}
.controls button:hover { border-color: var(--ink-soft); }

.panel { overflow-y: auto; padding: 22px 24px 40px; }
.panel h2 { font: 400 1.5rem/1.2 var(--serif); margin: 0 0 4px; overflow-wrap: anywhere; }
.panel h3 { font: 600 0.9375rem/1.3 var(--sans); margin: 26px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--paper-edge); }
.panel .sub { color: var(--ink-soft); font-size: 0.875rem; margin: 0; overflow-wrap: anywhere; }
.panel button.link { margin-bottom: 18px; }

.assets { list-style: none; padding: 0; margin: 0; }
.assets button {
  display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px;
  width: 100%; text-align: left; background: none; border: 0; border-radius: 3px; padding: 6px 6px; cursor: pointer;
}
.assets button:hover { background: var(--water); }
.assets .kindname { color: var(--ink-faint); font-size: 0.8125rem; }
.assets .name { overflow-wrap: anywhere; }

.fact { margin: 0 0 12px; }
.fact .label { font-size: 0.875rem; color: var(--ink-soft); margin: 0 0 2px; }
.none { color: var(--ink-faint); font-style: italic; font-size: 0.875rem; margin: 0 0 12px; }
.fact.conflict .label { color: var(--warn); font-weight: 600; }
.value { margin: 2px 0 8px; overflow-wrap: anywhere; white-space: pre-line; }
.value details, .value summary { white-space: normal; }
.value .count { color: var(--ink-faint); font-size: 0.8125rem; margin-left: 6px; }
details { margin: 2px 0 4px; }
summary { cursor: pointer; color: var(--ink-soft); font-size: 0.8125rem; width: fit-content; }
.evidence { list-style: none; margin: 6px 0 0; padding: 0 0 0 12px; border-left: 2px solid var(--paper-edge); font-size: 0.8125rem; }
.evidence li { margin: 0 0 8px; }
.evidence .frames { font-weight: 600; }
.evidence .meta { color: var(--ink-faint); }
.more { color: var(--ink-faint); font-size: 0.8125rem; margin: 0 0 6px; }

.op { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 0 0 2px; }
.op.write .text { color: var(--magenta); font-weight: 600; }
.op.write.rejected .text { font-weight: 400; }
.op .n { color: var(--ink-faint); }

.key { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: 0.875rem; }
.key li { display: grid; grid-template-columns: 34px 1fr; align-items: center; gap: 8px; }
.gap { margin: 0 0 10px; font-size: 0.875rem; }
.gap .n { font-weight: 600; margin-right: 6px; }
.gap .k { color: var(--ink-faint); font-size: 0.8125rem; overflow-wrap: anywhere; }
.empty { color: var(--ink-soft); font-size: 0.875rem; }
.conn { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--ink); text-decoration: underline; text-decoration-color: var(--ink-faint); text-underline-offset: 3px; }
.conn:hover { text-decoration-color: var(--ink); }

svg.sym { width: 22px; height: 22px; overflow: visible; }
svg.sym .f-buff { fill: var(--buff); stroke: var(--buff-edge); stroke-width: 1.5; }
svg.sym .f-green { fill: var(--sea-green-fill); stroke: var(--sea-green); stroke-width: 1.5; }
svg.sym .f-plain { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
svg.sym .f-faint { fill: var(--paper); stroke: var(--ink-faint); stroke-width: 1.5; }
svg.line { width: 34px; height: 10px; }
svg.line .l-ink { stroke: var(--ink-soft); stroke-width: 2; }
svg.line .l-write { stroke: var(--magenta); stroke-width: 3; }
svg.line .l-rej { stroke: var(--magenta); stroke-width: 2; stroke-dasharray: 5 3; }
svg.line .l-pub { stroke: var(--sea-green); stroke-width: 2; stroke-dasharray: 2 3; }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 62vh auto; height: auto; }
  .chart { border-right: 0; border-bottom: 1px solid var(--paper-edge); }
  .controls { top: auto; bottom: 14px; right: 14px; left: 14px; }
  .controls input { flex: 1; width: auto; }
  .cartouche { top: 14px; left: 14px; padding: 10px 14px; }
  .cartouche h1 { font-size: 1.375rem; margin-bottom: 4px; }
  .cartouche p { font-size: 0.8125rem; }
}
</style>
</head>
<body>
<div class="app">
  <main class="chart" aria-label="Asset chart. Use the asset list to select assets with the keyboard.">
    <div id="cy"></div>
    <div class="cartouche">
      <h1>Asset chart</h1>
      <p id="summary"></p>
      <p id="redaction" class="redaction"></p>
    </div>
    <div class="controls">
      <input id="search" type="search" placeholder="Find an asset" aria-label="Find asset">
      <button id="fit" type="button">Show all</button>
    </div>
  </main>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>
<script id="keelmap-data" type="application/json">{{DATA}}</script>
<script>{{CYTOSCAPE}}</script>
<script>{{APP}}</script>
</body>
</html>
